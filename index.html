<style>body { margin: 0; background: #FBF6EE; }</style>
<script>
  // One link for everyone: load the phone or desktop design into this page
  // instead of redirecting, so the address bar never changes.
  // A phone held sideways still counts as a phone (touch + small screen).
  // The page is fetched with the current version and no-store so in-app
  // browsers (Messages, Instagram, Gmail…) can't serve an old copy; the page
  // itself then checks version.json in case this index.html is the stale one.
  window.OB_VERSION='20261007153655';
  var isPhone = window.matchMedia('(max-width: 768px)').matches ||
    (window.matchMedia('(pointer: coarse)').matches && Math.min(screen.width, screen.height) <= 500);
  var page = isPhone ? 'mobile.html' : 'desktop.html';
  fetch(page + '?v=' + window.OB_VERSION, { cache: 'no-store' })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); })
    .then(function (html) {
      document.open();
      document.write(html);
      document.close();
    })
    .catch(function () { location.replace(page + location.hash); });
</script>
